# Performance settings for rezure.redscale.my.id — paste inside the site's
# `server { ... }` block that serves /var/www/rezure-websites/.vitepress/dist,
# then: sudo nginx -t && sudo systemctl reload nginx
#
# Why: Ubuntu's stock nginx.conf has `gzip on;` but leaves gzip_types
# commented out, so only text/html was compressed. The 130 KB stylesheet that
# blocks first paint and ~200 KB of JavaScript went out uncompressed, which is
# most of the mobile PageSpeed FCP/LCP. Every directive here is valid at
# server level, so nothing in nginx.conf needs to change.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/css
    text/plain
    text/xml
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

# VitePress fingerprints everything under /assets/ (style.HSFvVHH0.css), so a
# new build always gets new URLs: cache them for a year, never revalidate.
# The live site already sends `expires 30d` for these, so the server block
# has a location for them somewhere. A regex one (~* \.(css|js)$) wins over
# this prefix block, and a second `location /assets/` fails `nginx -t`: in
# either case change that existing block instead of adding this one.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Self-hosted Instrument Sans. Not fingerprinted, but the files only change
# if the font itself is swapped, so a month is safe.
location /fonts/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
}

# HTTP/2 lets the CSS, JS chunks, and font download in parallel over one
# connection instead of HTTP/1.1's six. Change the existing listen line, e.g.
#     listen 443 ssl;          ->   listen 443 ssl http2;
# (nginx 1.24 syntax; Certbot-managed blocks keep working.)
